<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0a1520"/>
  <!-- Outer targeting ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#ff1a2e" stroke-width="1.5" opacity="0.9"/>
  <!-- Crosshair ticks — top -->
  <line x1="16" y1="2" x2="16" y2="6" stroke="#ff1a2e" stroke-width="1.5"/>
  <!-- bottom -->
  <line x1="16" y1="26" x2="16" y2="30" stroke="#ff1a2e" stroke-width="1.5"/>
  <!-- left -->
  <line x1="2" y1="16" x2="6" y2="16" stroke="#ff1a2e" stroke-width="1.5"/>
  <!-- right -->
  <line x1="26" y1="16" x2="30" y2="16" stroke="#ff1a2e" stroke-width="1.5"/>
  <!-- Drone body (cyan X shape) -->
  <rect x="15" y="15" width="2" height="2" fill="#00f0ff"/>
  <!-- drone arms -->
  <line x1="13" y1="13" x2="15" y2="15" stroke="#00f0ff" stroke-width="1"/>
  <line x1="19" y1="13" x2="17" y2="15" stroke="#00f0ff" stroke-width="1"/>
  <line x1="13" y1="19" x2="15" y2="17" stroke="#00f0ff" stroke-width="1"/>
  <line x1="19" y1="19" x2="17" y2="17" stroke="#00f0ff" stroke-width="1"/>
  <!-- Drone rotors (small circles at arm tips) -->
  <circle cx="12" cy="12" r="1.5" fill="#00f0ff" opacity="0.85"/>
  <circle cx="20" cy="12" r="1.5" fill="#00f0ff" opacity="0.85"/>
  <circle cx="12" cy="20" r="1.5" fill="#00f0ff" opacity="0.85"/>
  <circle cx="20" cy="20" r="1.5" fill="#00f0ff" opacity="0.85"/>
</svg>
